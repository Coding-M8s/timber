name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  # The suite is bound by Git and CLI subprocesses, so it splits across runners.
  # tests/timings.json balances the shards by measured file duration; refresh it with
  # `bun test --parallel --timings tests/timings.json --update-timings` when files move.
  test:
    name: test (${{ matrix.shard }}/3)
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - run: bun run test --shard=${{ matrix.shard }}/3

  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - name: Lint the installer
        run: shellcheck --shell=sh install.sh
      - run: bun run build
      - run: bun dist/index.js --help
      - run: bun run build:release
      - run: bun run build:extension
      - name: Verify standalone shell completion
        run: |
          VERSION="$(bun --no-env-file -p 'require("./package.json").version')"
          TIMBER_COMPLETION_EXECUTABLE="$PWD/dist/release/timber-v$VERSION-linux-x64" \
            bun test tests/completion-bash.test.ts
      - name: Verify standalone checksums
        run: cd dist/release && sha256sum -c SHA256SUMS
      - run: docker build -f tests/release/Dockerfile -t timber-release-smoke .
      - name: Exercise standalone binary without Bun or Node
        run: |
          VERSION="$(bun --no-env-file -p 'require("./package.json").version')"
          docker run --rm --network none \
            --mount "type=bind,src=$PWD/dist/release,dst=/release,readonly" \
            timber-release-smoke \
            --binary "/release/timber-v$VERSION-linux-x64" \
            --expected-version "$VERSION" --require-no-runtime

  # The main ruleset requires a status named "check"; it passes only when every
  # shard and the build pass.
  check:
    needs: [test, build]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every CI job to pass
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for result in $RESULTS; do
            test "$result" = success || { echo "A required CI job finished with: $result" >&2; exit 1; }
          done
