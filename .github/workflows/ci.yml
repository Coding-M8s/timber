name: CI

on:
  push:
  pull_request:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version
      - name: Reject AI commit attribution
        run: bun --no-env-file scripts/check-commit-attribution.ts --event "$GITHUB_EVENT_PATH"
      - run: bun install --frozen-lockfile
      - name: Install Zsh
        run: |
          sudo apt-get update
          sudo apt-get install --yes zsh
          zsh --version
      - run: bun run typecheck
      - run: bun test
      - run: bun run build
      - run: bun dist/index.js --help
      - run: bun run build:release
      - name: Verify standalone checksums
        run: cd dist/release && sha256sum -c SHA256SUMS
      - run: docker build -f tests/release/Dockerfile -t timber-release-smoke .
      - name: Exercise standalone binary without Bun or Node
        run: |
          VERSION="$(bun --no-env-file -p 'require("./package.json").version')"
          docker run --rm --network none \
            --mount "type=bind,src=$PWD/dist/release,dst=/release,readonly" \
            timber-release-smoke \
            --binary "/release/timber-v$VERSION-linux-x64" \
            --expected-version "$VERSION" --require-no-runtime
