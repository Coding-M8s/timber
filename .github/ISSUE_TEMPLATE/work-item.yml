name: Work item
description: Propose or plan a Timber change
title: "[TIM-] "
labels: []
body:
  - type: markdown
    attributes:
      value: |
        Use this form for planned work. Put the Jira ticket ID in the title when available.

  - type: input
    id: ticket
    attributes:
      label: Ticket ID
      description: Jira or other tracking ID, if one exists.
      placeholder: TIM-123

  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: What outcome should this work deliver, and for whom?
      placeholder: Describe the intended result.
    validations:
      required: true

  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: What is included and what relevant boundaries apply?
      placeholder: Describe the work and important constraints.
    validations:
      required: true

  - type: textarea
    id: acceptance-criteria
    attributes:
      label: Acceptance criteria
      description: List observable outcomes that show the work is complete.
      placeholder: |
        - [ ] First outcome
        - [ ] Second outcome
      value: |
        - [ ]
    validations:
      required: true

  - type: textarea
    id: verification
    attributes:
      label: Verification
      description: How should the change be checked, including relevant failure cases?
      placeholder: Describe tests, manual checks, or other evidence.
    validations:
      required: true

  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies
      description: Link prerequisite or related issues. Enter “None” if there are no dependencies.
      placeholder: "- Depends on #123"

  - type: textarea
    id: planning-metadata
    attributes:
      label: Planning metadata
      description: Keep this consistent with the project board fields and labels.
      placeholder: "Dev 1 | v0.1 | P1 | Size S | Initial status: Backlog"
      value: "Dev  | v0.1 | P1 | Size S | Initial status: Backlog"
